[package]
name = "badi-screen"
description = "Badi's screen: captures per display, the screenshot/desktop coordinate math and mark crops (port of capture.js, region.js, brain/coords.js)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
badi-input = { path = "../badi-input" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
