[package]
name = "aina-agent"
description = "Kerjakan untukku (the Brain): the agent loop, the computer toolset on Windows, file tools with their guard, apps and links, and the browser extension bridge (port of src/brain/*, src/fileOps.js, the guard in src/agentTools.js)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
regex.workspace = true
fancy-regex = "0.14"
chrono.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = "0.26"
aina-input = { path = "../aina-input" }
aina-screen = { path = "../aina-screen" }
aina-uia = { path = "../aina-uia" }
aina-llm = { path = "../aina-llm" }
aina-net = { path = "../aina-net" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Storage_Packaging_Appx"] }
