[package]
name = "aina-app"
description = "aina: the Tauri app (windows, tray, bridge to the v1 UI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aina"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
aina-core = { path = "../aina-core" }
aina-input = { path = "../aina-input" }
aina-screen = { path = "../aina-screen" }
aina-uia = { path = "../aina-uia" }
aina-voice = { path = "../aina-voice" }
aina-llm = { path = "../aina-llm" }
aina-store = { path = "../aina-store" }
aina-agent = { path = "../aina-agent" }
aina-apps = { path = "../aina-apps" }
aina-net = { path = "../aina-net" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono.workspace = true
regex.workspace = true
# The IANA time zone for Composio (already in the tree through chrono).
iana-time-zone = "0.1"
# Demo screenshots (snap.rs): already in the tree through Tauri, so nothing new is compiled.
png = "0.17"
# The knowledge base reads Word (.docx is a zip of XML) and PDF files.
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.9"
# The PC's id for the free starter credits is sent hashed (cloud.rs).
sha2 = "0.10"
# WebView2's ProcessFailed event, so a crashed overlay page is rebuilt (already in the tree through wry).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "Win32_System_Console", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_Packaging_Appx", "ApplicationModel"] }
